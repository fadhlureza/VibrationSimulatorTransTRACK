<!DOCTYPE html>
<html>
<head>
    <title>Vibration Simulator</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <h1>Vibration Simulator</h1>
    
    <div class="control-panel" style="background-color: #f8f9fa; padding: 15px; margin-bottom: 20px; border-radius: 8px; border: 1px solid #ddd; text-align: center;">
        <h3 style="margin-top: 0; color: #333;">PID Coefficients</h3>
        <label style="font-weight: bold; margin-right: 10px; color: #333;">
            KP: <input type="number" id="input-kp" step="0.001" value="1.000" style="width: 80px; margin-right: 20px;">
        </label>
        <label style="font-weight: bold; margin-right: 10px; color: #333;">
            KI: <input type="number" id="input-ki" step="0.001" value="0.000" style="width: 80px; margin-right: 20px;">
        </label>
        <label style="font-weight: bold; margin-right: 10px; color: #333;">
            KD: <input type="number" id="input-kd" step="0.001" value="0.000" style="width: 80px; margin-right: 20px;">
        </label>
        <button onclick="updatePID()" style="padding: 6px 20px; font-weight: bold; cursor: pointer; background-color: #2196F3; color: white; border: none; border-radius: 4px;">UPDATE PID</button>
        <span id="update-status" style="margin-left: 15px; font-weight: bold;"></span>
    </div>

    <div class="graph-container">
        
        <div class="graph-wrapper">
            <h3>Target (g) <span id="val-target" style="color: orange;">[ 0.00 ]</span></h3>
            <canvas id="targetGCanvas" width="800" height="150"></canvas>
        </div>
        
        <div class="graph-wrapper">
            <h3>Pure (g) <span id="val-pure" style="color: blue;">[ 0.00 ]</span></h3>
            <canvas id="pureGCanvas" width="800" height="150"></canvas>
        </div>
        
        <div class="graph-wrapper">
            <h3>Calibrated (g) <span id="val-calG" style="color: green;">[ 0.00 ]</span></h3>
            <canvas id="calibratedGCanvas" width="800" height="150"></canvas>
        </div>
        
        <div class="graph-wrapper">
            <h3>Calibrated (m/s&sup2;) <span id="val-calMs2" style="color: red;">[ 0.00 ]</span></h3>
            <canvas id="calibratedMs2Canvas" width="800" height="150"></canvas>
        </div>
        
        <div class="graph-wrapper">
            <h3>Dominant Frequency <span id="val-freq" style="color: purple;">[ 0.00 ]</span></h3>
            <canvas id="freqCanvas" width="800" height="150"></canvas>
        </div>
        
        <div class="graph-wrapper">
            <h3>Output Combined 
                <span style="font-size: 14px; font-weight: normal; margin-left: 10px;">
                    ( Target G: <span id="val-targetG" style="color: #FF9800; font-weight: bold;">0</span> | 
                    PWM: <span id="val-pwm" style="color: #9C27B0; font-weight: bold;">0</span> | 
                    G: <span id="val-combG" style="color: red; font-weight: bold;">0.00</span> )
                </span>
            </h3>
            <canvas id="combinedCanvas" width="800" height="150"></canvas>
        </div>
        
        <div class="graph-wrapper">
            <h3>History 1 Jam
                <span style="font-size: 14px; font-weight: normal; margin-left: 10px;">
                    ( Target G: <span id="val-histTarget" style="color: #FF9800; font-weight: bold;">0</span> | 
                    PWM: <span id="val-histPwm" style="color: #9C27B0; font-weight: bold;">0</span> | 
                    G: <span id="val-histG" style="color: red; font-weight: bold;">0.00</span> )
                </span>
            </h3>
            <canvas id="historyCanvas" width="800" height="150"></canvas>
        </div>
        
    </div> <script src="script.js"></script>
</body>
</html>
